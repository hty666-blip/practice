workflows:
  ios-unsigned:
    name: GymCoach iOS unsigned build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GymCoach.xcodeproj"
        XCODE_SCHEME: "GymCoach"
    scripts:
      - name: Build GymCoach without code signing
        script: |
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcodebuild_logs/build.log
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphoneos/*.app
      - build/DerivedData/Build/Products/Debug-iphoneos/*.dSYM
      - /tmp/xcodebuild_logs/*.log
